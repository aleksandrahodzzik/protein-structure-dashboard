[project]
name = "protein-dashboard"
version = "0.1.0"
description = "Streamlit dashboard: fetch RCSB PDB structures, analyse sequences with Biopython, render 3D with py3Dmol."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "biopython>=1.85",
    "plotly>=5.24",
    "py3Dmol>=2.4",
    "requests>=2.32",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pandas-stubs",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "responses>=0.25",
    "ruff>=0.8",
    "types-requests",
]
screenshots = ["playwright>=1.48"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/protein_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["protein_dashboard"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
